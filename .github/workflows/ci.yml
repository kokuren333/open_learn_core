name: open-learn-core

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run validate:all
      - run: npm run course:audit -- linear-algebra
      - run: npm run build -- linear-algebra
      - run: npm run build:video -- linear-algebra
      - run: npm run publish:manifest -- linear-algebra
      - run: npm run publication:audit -- linear-algebra
