<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Vector operations"><rect width="900" height="300" rx="20" fill="#f7faf3"/><g font-family="sans-serif" fill="#18321f" text-anchor="middle"><text x="150" y="45" font-size="20" font-weight="700">成分で計算</text><text x="450" y="45" font-size="20" font-weight="700">幾何的に操作</text><text x="750" y="45" font-size="20" font-weight="700">対応を検算</text><text x="150" y="110" font-size="22">u=(1,2), v=(3,-1)</text><text x="450" y="110" font-size="22">u+v=(4,1)</text><text x="750" y="110" font-size="22">-2u=(-2,-4)</text><text x="150" y="245" font-size="17">(1+3, 2-1)</text><text x="450" y="245" font-size="17">同じ倍率で全成分を変える</text><text x="750" y="245" font-size="17">負号は向きを反転</text></g><path d="M260 145H340M560 145H640" stroke="#71a287" stroke-width="5"/><path d="M340 145l-16-10v20zM640 145l-16-10v20z" fill="#71a287"/></svg>
