  "slides": [
    { "id": 1, "script": "今回は、基底を具体例から考えます。", "spoken_script": "こんかいは、きていをぐたいれいからかんがえます。", "note_top": "基底を具体例から", "note_bottom": "まず、二本の材料から一つのベクトルを作ります。" },
    { "id": 2, "script": "v=3e₁+2e₂は、横へ3回分、縦へ2回分の移動です。", "spoken_script": "ブイは、さんイーワンと、にイーツーです。よこへさんかいぶん、たてへにかいぶんのいどうです。", "note_top": "係数を移動として読む", "note_bottom": "係数は数字の飾りではなく、基底ベクトルを何倍するかを表します。" },
    { "id": 3, "script": "spanは、係数をすべて動かして作れるベクトルの全体です。", "spoken_script": "すぱんは、けいすうをすべてうごかしてつくれるベクトルのぜんたいです。", "note_top": "span = 作れる範囲", "note_bottom": "材料が一方向だけなら直線、二方向なら平面へ広がります。" },
    { "id": 4, "script": "線形独立性は、零ベクトルを作る係数がすべて0しかないことです。", "spoken_script": "せんけいどくりつせいは、ぜろベクトルをつくるけいすうがすべてぜろしかないことです。", "note_top": "独立性 = 重複がない", "note_bottom": "余分な材料があると、非自明な零関係が生まれます。" },
    { "id": 5, "script": "基底とは、空間をspanし、線形独立でもある集合です。", "spoken_script": "きていとは、くうかんをすぱんし、せんけいどくりつでもあるしゅうごうです。", "note_top": "basis = span + independence", "note_bottom": "作れることと、余分がないことを同時に満たします。" },
    { "id": 6, "script": "標準基底でなくても、二つの条件を満たせば基底です。", "spoken_script": "ひょうじゅんきていでなくても、ふたつのじょうけんをみたせばきていです。", "note_top": "斜めの基底もある", "note_bottom": "基底は見た目ではなく、spanと独立性で決まります。" },
    { "id": 7, "script": "基底による展開の係数が、その基底に関する座標です。", "spoken_script": "きていによるてんかいのけいすうが、そのきていにかんするざひょうです。", "note_top": "係数 = 基底座標", "note_bottom": "基底を変えると座標は変わりますが、ベクトル自体は変わりません。" },
    { "id": 8, "script": "基底を判定するときは、作れるか、余分がないかを順に確認します。", "spoken_script": "きていをはんていするときは、つくれるか、よぶんがないかをじゅんにかくにんします。", "note_top": "二つの問いで判定", "note_bottom": "この二つの問いが、定義・図・計算を一つにつなぎます。" }
  ],
